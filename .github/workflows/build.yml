name: Build & Package EduLab Windows Apps

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish EduLab.Server (Self-Contained)
      run: |
        dotnet publish src/EduLab.Server/EduLab.Server.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/EduLab_Server
        copy scripts\setup_server_firewall.bat dist\EduLab_Server\

    - name: Publish EduLab.Client (Self-Contained)
      run: |
        dotnet publish src/EduLab.Client/EduLab.Client.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/EduLab_Client
        copy scripts\install_client.bat dist\EduLab_Client\

    - name: Upload Server Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EduLab_Server_Windows
        path: dist/EduLab_Server/

    - name: Upload Client Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EduLab_Client_Windows
        path: dist/EduLab_Client/
